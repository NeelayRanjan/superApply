[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "firstlook"
version = "0.1.0"
description = "Local-first, provenance-backed job search workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.4",
  "httpx[http2]==0.28.1", "selectolax==0.3.29", "typer==0.15.3",
  "rapidfuzz==3.13.0", "numpy==2.2.5", "scikit-learn==1.6.1",
  "PyYAML==6.0.2", "playwright==1.51.0", "pypdf==5.5.0",
]

[project.optional-dependencies]
model = ["onnxruntime==1.21.1", "tokenizers==0.21.1"]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.8", "mypy==1.15.0", "types-PyYAML==6.0.12.20250402", "hypothesis==6.131.9", "typst==0.13.2", "build==1.2.2.post1"]

[project.scripts]
firstlook = "firstlook.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["backend/firstlook"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "--cov=firstlook --cov-report=term-missing"

[tool.hatch.build.targets.wheel.force-include]
"data" = "firstlook/resources/data"
"frontend/dist" = "firstlook/resources/frontend/dist"

[tool.hatch.build.targets.sdist]
include = ["backend", "frontend/src", "frontend/index.html", "frontend/package.json", "frontend/package-lock.json", "frontend/tsconfig.json", "frontend/vite.config.ts", "frontend/eslint.config.js", "data", "fixtures", "tests", "scripts", "*.md", "Makefile", "pyproject.toml", "requirements.lock"]

[tool.hatch.build.targets.sdist.force-include]
"frontend/dist" = "frontend/dist"
